name: fetch-js-page
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Full URL of the JS page to read'
        required: true
        type: string
      connect:
        description: 'Optional CDP websocket URL of a remote browser to control (skips local browser setup)'
        required: false
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup stealth browser
        if: ${{ inputs.connect == '' }}
        run: |
          python -m pip install --upgrade pip
          pip install patchright
          patchright install chromium

      - name: Setup client only
        if: ${{ inputs.connect != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install patchright

      - name: Render page and extract text
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" python - <<'EOF'
          import asyncio, os
          from patchright.async_api import async_playwright

          URL = os.environ["PAGE_URL"]
          CONNECT = os.environ.get("CONNECT_URL", "")

          async def main():
              async with async_playwright() as p:
                  if CONNECT:
                      browser = await p.chromium.connect_over_cdp(CONNECT, timeout=60000)
                      ctx = browser.contexts[0] if browser.contexts else await browser.new_context()
                      print("connected to remote browser over CDP")
                  else:
                      browser = await p.chromium.launch(
                          headless=False,
                          channel="chromium",
                      )
                      ctx = await browser.new_context(
                          viewport={"width": 1280, "height": 900},
                          locale="en-US",
                          timezone_id="America/New_York",
                      )
                  page = await ctx.new_page()
                  print("goto", URL)
                  await page.goto(URL, wait_until="domcontentloaded", timeout=90000)

                  # wait for challenge/JS to settle: check if innerText is growing
                  last_len = -1
                  same = 0
                  for i in range(60):
                      await page.wait_for_timeout(5000)
                      try:
                          txt = await page.evaluate("document.body ? document.body.innerText : ''")
                          print("tick", i, "len", len(txt), "title", (await page.title())[:50])
                          if len(txt) == last_len:
                              same += 1
                          else:
                              same = 0
                          last_len = len(txt)
                          # short-circuit: stable for 3 consecutive ticks (15s) and non-trivial
                          if same >= 3 and len(txt) > 200:
                              break
                      except Exception as e:
                          print("tick", i, "err", e)

                  txt = await page.evaluate("document.body ? document.body.innerText : ''")
                  with open("page_text.txt", "w") as f:
                      f.write(txt)
                  print("PAGE_TEXT_LEN", len(txt))

                  # try the same URL as JSON too (works for JSON APIs)
                  try:
                      r = await page.evaluate(
                          """async (u) => {
                              const resp = await fetch(u, {headers: {'Accept': 'application/json'}});
                              return {status: resp.status, body: await resp.text()};
                          }""",
                          URL,
                      )
                      body = (r or {}).get("body", "")
                      if (r or {}).get("status") == 200 and body.strip().startswith("{"):
                          with open("page.json", "w") as f:
                              f.write(body)
                          print("GOT_JSON_LEN", len(body))
                  except Exception as e:
                      print("json attempt err", e)

                  # full rendered HTML backup
                  try:
                      html = await page.content()
                      with open("page.html", "w") as f:
                          f.write(html)
                      print("PAGE_HTML_LEN", len(html))
                  except Exception as e:
                      print("html err", e)

                  try:
                      await browser.close()
                  except Exception as e:
                      print("close err", e)

          asyncio.run(main())
          EOF
        env:
          PAGE_URL: ${{ inputs.url }}
          CONNECT_URL: ${{ inputs.connect }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page
          path: |
            page_text.txt
            page.json
            page.html
          if-no-files-found: warn
