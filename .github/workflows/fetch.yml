name: fetch-js-page

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Full URL of the JS page / share link / file to read'
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/siddhantanandi2003-debug/fetch:latest
    timeout-minutes: 15
    steps:
      # The custom image is python:3.11-slim with NO curl/git, so fetch the
      # script with python's urllib (python is always present in the image).
      - name: Get fetcher script
        run: |
          python - <<'PY'
          import urllib.request, os
          url = "https://raw.githubusercontent.com/siddhantanandi2003-debug/claude-fetch-tmp/main/fetch_page.py"
          urllib.request.urlretrieve(url, "fetch_page.py")
          print("script bytes:", os.path.getsize("fetch_page.py"))
          PY

      - name: Ensure browser binary
        run: python -m patchright install chromium

      # -------- ROUTE 1: stealth browser (patchright, non-headless under xvfb) --------
      - name: Render page and extract text (Route 1)
        run: xvfb-run -a --server-args="-screen 0 1280x900x24" python fetch_page.py
        env:
          PAGE_URL: ${{ inputs.url }}

      # -------- ROUTE 2: ZenRows premium proxy, only if Route 1 was not OK --------
      # Needs a repo secret ZENROWS_API_KEY (Settings > Secrets and variables > Actions).
      # Uses python urllib (no curl in this image).
      - name: Fallback route (ZenRows) if Route 1 failed
        if: always()
        env:
          PAGE_URL: ${{ inputs.url }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          status=$(python -c "import json;print(json.load(open('fetch_status.json'))['status'])" 2>/dev/null || echo UNKNOWN)
          echo "Route 1 verdict: $status"
          if [ "$status" = "OK" ]; then
            echo "Route 1 OK — skipping fallback."
            exit 0
          fi
          if [ -z "$ZENROWS_API_KEY" ]; then
            echo "::warning title=No fallback::Route 1 = $status, but ZENROWS_API_KEY secret is not set."
            exit 0
          fi
          echo "Route 1 = $status — trying Route 2 (ZenRows premium proxy)..."
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          url = os.environ["PAGE_URL"]
          key = os.environ.get("ZENROWS_API_KEY", "")
          n = 0
          try:
              qs = urllib.parse.urlencode({
                  "apikey": key, "url": url, "js_render": "true",
                  "premium_proxy": "true", "response_type": "plaintext", "wait": "8000",
              })
              req = urllib.request.Request("https://api.zenrows.com/v1/?" + qs)
              with urllib.request.urlopen(req, timeout=150) as r:
                  data = r.read()
              with open("page_text.txt", "wb") as f:
                  f.write(data)
              n = len(data)
          except Exception as e:
              print("zenrows fallback err:", type(e).__name__, e)
          with open("fetch_status.json", "w") as f:
              json.dump({"status": "OK" if n >= 200 else "EMPTY",
                         "detail": "ZenRows premium-proxy fallback",
                         "route": "zenrows", "bytes": n}, f, indent=2)
          print("fallback bytes:", n)
          PY

      - name: Report verdict (fail loud if BOTH routes failed)
        if: always()
        run: |
          echo "----- fetch_status.json -----"
          cat fetch_status.json 2>/dev/null || echo "(no status file)"
          status=$(python -c "import json;print(json.load(open('fetch_status.json'))['status'])" 2>/dev/null || echo UNKNOWN)
          echo "FINAL_VERDICT=$status"
          if [ "$status" != "OK" ]; then
            echo "::warning title=Fetch not OK::both routes failed, status=$status"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page
          path: |
            page_text.txt
            page.json
            page.html
            page.bin
            fetch_status.json
          if-no-files-found: warn
