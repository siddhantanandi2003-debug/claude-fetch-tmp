name: fetch-claude
on: workflow_dispatch

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup python and patchright
        run: |
          python -m pip install --upgrade pip
          pip install patchright
          patchright install chromium

      - name: Fetch via stealth browser
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" python - <<'EOF'
          import asyncio
          from patchright.async_api import async_playwright

          SHARE_ID = "8e155b3f-03d5-4307-88a1-da998bffc075"

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=False,
                      channel="chromium",
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1280, "height": 900},
                      locale="en-US",
                      timezone_id="America/New_York",
                  )
                  page = await ctx.new_page()
                  print("goto share page...")
                  await page.goto(
                      "https://claude.ai/share/" + SHARE_ID,
                      wait_until="domcontentloaded",
                      timeout=90000,
                  )
                  data = None
                  for i in range(60):
                      await page.wait_for_timeout(5000)
                      try:
                          title = await page.title()
                          r = await page.evaluate(
                              """async (sid) => {
                                  const resp = await fetch('/api/share/' + sid, {headers: {'Accept': 'application/json'}});
                                  return {status: resp.status, body: await resp.text()};
                              }""",
                              SHARE_ID,
                          )
                          body = (r or {}).get("body", "")
                          status = (r or {}).get("status")
                          print("attempt", i, "title", title[:40], "status", status, "body[:60]", body[:60])
                          if status == 200 and body.strip().startswith("{"):
                              data = body
                              break
                      except Exception as e:
                          print("attempt", i, "err", e)
                  if data:
                      with open("share.json", "w") as f:
                          f.write(data)
                      print("GOT_JSON_LEN", len(data))
                  else:
                      print("NO_JSON_FROM_BROWSER")
                  try:
                      txt = await page.evaluate("document.body ? document.body.innerText : ''")
                      with open("page_text.txt", "w") as f:
                          f.write(txt)
                      print("PAGE_TEXT_LEN", len(txt))
                  except Exception as e:
                      print("text err", e)
                  await browser.close()

          asyncio.run(main())
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share
          path: |
            share.json
            page_text.txt
          if-no-files-found: warn
